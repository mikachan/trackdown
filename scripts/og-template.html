<!doctype html>
<!--
  Link-preview image for Trackdown. The track is hand-drawn, not a real coaster, so it never spoils a puzzle.
  Regenerate app/static/og.png with:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --screenshot=app/static/og.png "file://$PWD/scripts/og-template.html"
-->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #faf8f5; font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; color: #1d1b19;
  display: grid; grid-template-columns: 1fr 520px; align-items: center; padding: 0 80px; box-sizing: border-box; }
h1 { font-size: 112px; line-height: 1; margin: 0 0 24px; color: #d6462c; letter-spacing: -0.03em; font-weight: 800; }
p { font-size: 40px; line-height: 1.25; margin: 0; color: #4a4540; max-width: 520px; }
svg { width: 520px; height: 520px; }
path { fill: none; stroke: #d6462c; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
</style></head><body>
<div><h1>Trackdown</h1><p>Guess the roller coaster from its track. A new one every day.</p></div>
<svg viewBox="0 0 100 100" aria-hidden="true">
  <path d="M10 80 L30 80 C40 80 38 22 48 20 C58 18 58 46 50 48 C42 50 42 34 52 30 C64 26 66 70 74 72 C82 74 84 52 88 52 C92 52 92 80 80 84 L22 86 C14 86 10 84 10 80 Z"/>
</svg>
</body></html>
